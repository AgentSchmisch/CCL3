name: Build and Test Android App

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches-ignore:
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      # Step 3: Install Required Tools
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip                    

      # Step 4: Install Android SDK
      - name: Install Android SDK
        run: |
          SDK_ROOT=$HOME/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O commandlinetools.zip
          unzip -q commandlinetools.zip -d $SDK_ROOT/cmdline-tools
          mv $SDK_ROOT/cmdline-tools/cmdline-tools $SDK_ROOT/cmdline-tools/tools
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$SDK_ROOT/cmdline-tools/tools/bin:$SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV
          export ANDROID_HOME=$SDK_ROOT
          export PATH=$SDK_ROOT/cmdline-tools/tools/bin:$SDK_ROOT/platform-tools:$PATH                    

      # Step 5: Accept SDK Licenses
      - name: Accept SDK Licenses
        run: |
          yes | $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager --licenses || true                    

      # Step 6: Install SDK Components
      - name: Install SDK Components
        run: |
          $HOME/android-sdk/cmdline-tools/tools/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"                    

      # Step 7: Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Step 8: Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-                        

      # Step 9: Build the APK
      - name: Build APK
        run: ./gradlew assembleDebug

    

